
name: AbyssX Launcher

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore "AbyssX__Launcher/AbyssXLauncher.csproj"

      - name: Build
        run: dotnet build "AbyssX__Launcher/AbyssXLauncher.csproj" --configuration Release --no-restore

      - name: Test
        run: dotnet test "AbyssX__Launcher/AbyssXLauncher.csproj" --configuration Release --no-build
